[project]
name = "nlp2llm"
version = "0.1.0"
description = "Learning NLP and LLM"
requires-python = ">=3.10,<3.12"

# Safe, shared dependencies
dependencies = [
    "absl-py>=2.3.1,<3",
    "torch==2.3.1",
    "torchtext==0.18.0",
    "torchvision==0.18.1",
]

[dependency-groups]

# PyTorch-only (recommended for Transformers / LLMs)
torch = [
    "torch>=2.1,<3",
    "torchvision>=0.16,<1",
    "torchtext>=0.16,<1",
    "transformers[sentencepiece]>=4.57,<5",
]

# TensorFlow-only notebooks
tensorflow = [
    "tensorflow==2.12.0",
]

# MIXED backend (TensorFlow + PyTorch)
# Use ONLY for notebooks that strictly require both
mix = [
    "tensorflow==2.12.0",
    "torch>=2.1,<3",
    "torchvision>=0.16,<1",
    "torchtext>=0.16,<1",
    "transformers[sentencepiece]>=4.57.3,<5",
]

# Dev / Jupyter
dev = [
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
